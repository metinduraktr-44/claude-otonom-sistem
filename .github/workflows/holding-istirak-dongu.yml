name: holding-istirak-dongu
on:
  schedule:
    - cron: "0 2 * * *"   # her gece 02:00 UTC — ülke arşiv + org yenile
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Holding iştirak + soru bankası + ülke iskeleti
        run: |
          python3 scripts/holding_istirak_ajans_uret.py --hepsi --pilot-limit 48
          python3 scripts/holding_istirak_ajans_uret.py --dogrula
      - name: Commit
        run: |
          git config user.name "otonom-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/holding_istirak_org.json data/soru_bankasi.json data/ulke_pazar_iskeleti.json \
            docs/HOLDING-ISTIRAK-ORG.md docs/OZ-DENETIM-SORU-BANKASI.md docs/ULKE-PAZAR-ISKELETI.md \
            docs/SECRETS-DRYRUN-MATRISI.md uretim/rol-kartlari uretim/ulke-arsiv \
            uretim/devir/CLAUDE-CODE-MASTER-PROMPT-HOLDING-V2.md uretim/OZET-TEK-SAYFA.md .env.example || true
          git commit -m "holding-istirak: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push || echo "push skipped"
