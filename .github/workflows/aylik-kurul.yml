name: aylik-kurul
on:
  schedule:
    - cron: "0 6 1 * *"   # ayın 1'i 06:00 UTC = 09:00 Istanbul (CILT6 §3 kurul)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Aylık kurul tutanağı (faz kapıları + upstream delta gündemi)
        run: python3 scripts/daily_agency.py --aylik
      - name: MCP×etki arşivi + prompt index yenile (pilot materyalize)
        run: python3 scripts/mcp_ajans_etki_uret.py --hepsi --pilot --dogrula
      - name: Commit
        run: |
          git config user.name "otonom-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "kurul: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push || echo "push skipped"
